<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .chat-container {
            width: 350px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .chat-header {
            display: flex;
            align-items: center;
            background: #007bff;
            color: white;
            padding: 8px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .chat-header div {
            display: flex;
            flex-direction: column;
            line-height: 0; /* Mengurangi jarak antar teks */
        }
        .chat-box {
            height: 430px;
            overflow-y: auto;
            padding: 10px;
            background: #f9f9f9;
        }
        .message {
            padding: 10px;
            border-radius: 5px;
            margin: 5px 0;
            max-width: 80%;
        }
        .user {
            background: #007bff;
            color: white;
            align-self: flex-end;
            text-align: right;
        }
        .bot {
            background: #e0e0e0;
            align-self: flex-start;
        }
        .chat-input {
            display: flex;
            border-top: 1px solid #ccc;
            padding: 5px;
            background: white;
        }
        .chat-input input {
            flex: 1;
            padding: 8px;
            border: none;
            outline: none;
        }
        .chat-input button {
            background: #007bff;
            border: none;
            color: white;
            padding: 8px 15px;
            cursor: pointer;
        }
        .typing-indicator {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 5px;
    padding: 10px;
    background: #e0e0e0;
    border-radius: 10px;
    width: fit-content;
    margin: 5px 0;
}

.typing-indicator span {
    width: 8px;
    height: 8px;
    background-color: gray;
    border-radius: 50%;
    animation: typingAnimation 1.5s infinite ease-in-out;
}

.typing-indicator span:nth-child(2) {
    animation-delay: 0.2s;
}

.typing-indicator span:nth-child(3) {
    animation-delay: 0.4s;
}

@keyframes typingAnimation {
    0% { opacity: 0.3; transform: translateY(0px); }
    50% { opacity: 1; transform: translateY(-5px); }
    100% { opacity: 0.3; transform: translateY(0px); }
}


    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <img src="https://img.freepik.com/premium-vector/cute-robot-waving-hand-cartoon-illustration_138676-2744.jpg?w=740" alt="Avatar" class="avatar">
            <div>
                <h3>Neura Chat</h3>
                <p>dengan Lumin 1.0</p>
            </div>
        </div>
        <div class="chat-box" id="chat-box">
            <div class="message bot">Hi😁I'm Neura..what can I help with in today?<span class="time"></span></div>
        </div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Type message..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()">&#9658;</button>
        </div>
    </div>
    <script>
          function sendMessage() {
            console.log("sendMessage() dipanggil");
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const userMessage = inputField.value.trim();
            if (userMessage === "") return;
            
            const userDiv = document.createElement("div");
            userDiv.className = "message user";
            userDiv.innerHTML = userMessage;
            chatBox.appendChild(userDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            const typingIndicator = document.createElement("div");
            typingIndicator.className = "message bot typing-indicator";
            typingIndicator.innerHTML = "<span></span><span></span><span></span>";
            chatBox.appendChild(typingIndicator);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            setTimeout(() => {
                chatBox.removeChild(typingIndicator);
                const botResponse = getBotResponse(userMessage);
                const botDiv = document.createElement("div");
                botDiv.className = "message bot";
                botDiv.innerHTML = botResponse;
                chatBox.appendChild(botDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 2000);
            
            inputField.value = "";
        }

        function handleEnter(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

</body>
